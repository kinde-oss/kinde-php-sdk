  securitySchemes:
    kindeBearerAuth:
      description: |
        To access these endpoints, you will need to use a user token. This can be obtained when your users sign in via the methods you've setup in Kinde (e.g. Google, passwordless, etc). Find this using the getToken command in the relevant SDK.
      type: http
      scheme: bearer
      bearerFormat: JWT
    kindeDPoPAuth:
      description: |
        A user access token bound to the app's key with DPoP (RFC 9449), sent as `Authorization: DPoP <token>` with a `DPoP` proof header for the request, including the `ath` claim.
      type: http
      scheme: DPoP
  responses:
    bad_request:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
    forbidden:
      description: Unauthorized - invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
    too_many_requests:
      description: Too many requests. Request was throttled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
