openapi: 3.0.0
info:
  version: '1'
  title: Kinde Account API
  description: |

    Provides endpoints to operate on an authenticated user.

    ## Intro

    ## How to use

    1. Get a user access token - this can be obtained when a user signs in via the methods you've setup in Kinde (e.g. Google, passwordless, etc).

    2. Call one of the endpoints below using the user access token in the Authorization header as a Bearer token. Typically, you can use the `getToken` command in the relevant SDK.
  termsOfService: https://docs.kinde.com/trust-center/agreements/terms-of-service/
  contact:
    name: Kinde Support Team
    email: support@kinde.com
    url: https://docs.kinde.com
servers:
  - url: https://{subdomain}.kinde.com
    variables:
      subdomain:
        default: your_kinde_subdomain
        description: The subdomain generated for your business on Kinde.
tags:
  - name: Billing
    x-displayName: Billing
  - name: Feature flags
    x-displayName: Feature flags
  - name: OAuth
    x-displayName: OAuth
  - name: Passkeys
    x-displayName: Passkeys
  - name: Permissions
    x-displayName: Permissions
  - name: Self-serve portal
    x-displayName: Self-serve portal
  - name: Properties
    x-displayName: Properties
  - name: Roles
    x-displayName: Roles
paths:
  /account_api/v1/entitlements:
    servers: []
    get:
      tags:
        - Billing
      operationId: GetEntitlements
      summary: Get entitlements
      description: |
        Returns entitlements for self-serve billing visibility (for example a
        Plan details screen), using the caller's user access token.

        Prefers the user's active personal plan. If they do not have one, returns
        their organization's plan entitlements when they have `org:read:billing`
        (same gate as the self-serve portal organization Plan page).

        Not intended as the universal B2B feature gate for every org member.
        For server-side feature gating from a billing customer's plan, use the
        Management API `GET /api/v1/billing/entitlements` with the relevant
        `customer_id` instead.
      parameters:
        - name: page_size
          in: query
          required: false
          description: Number of results per page. Defaults to 10 if parameter not sent.
          schema:
            type: integer
            nullable: true
        - name: starting_after
          in: query
          required: false
          description: The ID of the entitlement to start after.
          schema:
            type: string
            nullable: true
            example: entitlement_1234567890abcdef
      responses:
        '200':
          description: Billing entitlements successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_entitlements_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /account_api/v1/entitlement:
    servers: []
    get:
      tags:
        - Billing
      operationId: GetEntitlement
      summary: Get entitlement
      description: |
        Returns the entitlement matching the `key` feature key, for self-serve
        billing visibility, using the caller's user access token.

        Prefers the user's active personal plan. If they do not have one, returns
        the matching organization entitlement when they have `org:read:billing`
        (same gate as the self-serve portal organization Plan page).

        Not intended as the universal B2B feature gate for every org member.
        For server-side feature gating from a billing customer's plan, use the
        Management API `GET /api/v1/billing/entitlements` with the relevant
        `customer_id` instead.
      parameters:
        - name: key
          in: path
          required: true
          description: The key of the feature
          schema:
            type: string
      responses:
        '200':
          description: Billing entitlement successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_entitlement_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /account_api/v1/feature_flags:
    servers: []
    get:
      tags:
        - Feature flags
      operationId: GetFeatureFlags
      summary: Get feature flags
      description: |
        Returns all the feature flags that affect the user
      parameters:
        - name: page_size
          in: query
          required: false
          description: Number of results per page. Defaults to 10 if parameter not sent.
          schema:
            type: integer
            nullable: true
        - name: starting_after
          in: query
          required: false
          description: The ID of the flag to start after.
          schema:
            type: string
            nullable: true
            example: flag_1234567890abcdef
      responses:
        '200':
          description: Feature flags successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_feature_flags_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /oauth2/v2/user_profile:
    servers: []
    get:
      tags:
        - OAuth
      operationId: getUserProfileV2
      summary: Get user profile
      description: |
        This endpoint returns a user's ID, names, profile picture URL and email of the currently logged in user.
      responses:
        '200':
          description: Details of logged in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_profile_v2'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /oauth2/introspect:
    servers: []
    post:
      tags:
        - OAuth
      operationId: tokenIntrospection
      summary: Introspect
      description: Retrieve information about the provided token.
      requestBody:
        description: Token details.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  description: The token to be introspected.
                  type: string
                  example: rrkYRaz8z96sAiOxPt6IzOCoelFFT4ujWIM2XNZgZsmX2Zu3imZ1W
                token_type_hint:
                  type: string
                  description: A hint about the token type being queried in the request.
                  enum:
                    - access_token
                    - refresh_token
              required:
                - token
      responses:
        '200':
          description: Details of the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_introspect'
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/token_introspect'
        '401':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_error_response'
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/token_error_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /oauth2/revoke:
    servers: []
    post:
      tags:
        - OAuth
      operationId: tokenRevocation
      summary: Revoke token
      description: Use this endpoint to invalidate an access or refresh token. The token will no longer be valid for use.
      requestBody:
        description: Details of the token to be revoked.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: The `client_id` of your application.
                  example: 3b0b5c6c8fcc464fab397f4969b5f482
                client_secret:
                  type: string
                  description: The `client_secret` of your application. Required for backend apps only.
                  example: rrkYRaz8z96sAiOxPt6IzOCoelFFT4ujWIM2XNZgZsmX2Zu3imZ1W
                token:
                  description: The token to be revoked.
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MTIzNDU2Nzg5LCJuYW1lIjoiSm9zZXBoIn0.OpOSSw7e485LOP5PrzScxHb7SR6sAOMRckfFwi4rp7o
                token_type_hint:
                  type: string
                  description: The type of token to be revoked.
                  enum:
                    - access_token
                    - refresh_token
              required:
                - token
                - client_id
      responses:
        '200':
          description: Token successfully revoked.
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_error_response'
        '403':
          $ref: '#/components/responses/forbidden'
        '429':
          $ref: '#/components/responses/too_many_requests'
      security:
        - kindeBearerAuth: []
  /account_api/v1/passkeys/registration/options:
    servers: []
    post:
      tags:
        - Passkeys
      operationId: GetPasskeyRegistrationOptions
      summary: Start adding a passkey from a native app
      description: |
        Starts adding a passkey to the signed-in user's account from inside an iOS or Android app, without a browser. Pass `public_key` unchanged to Credential Manager (Android) or AuthenticationServices (iOS), then send the result to the verify endpoint with `registration_session`.

        Call it on the domain the app signs in on: the passkey is created for that domain.

        Requirements:
        - The access token was granted the `passkeys:register` scope: ask for it when signing the user in. Any front-end or mobile application can ask for it; using it also needs native sign-in turned on for the application.
        - The access token was issued for Kinde itself, without an `audience`. A token issued for your own API is refused, because it is sent to that API and could be leaked from there. If your app requests an `audience` at sign-in, get a separate token without one for this call: if the user signed in through the browser, send them through the browser again straight after, without `audience` and asking for `passkeys:register`. That reuses their browser session, so it needs no second sign-in, and the new token carries the time of that sign-in, so it is accepted within the same 10 minutes. Native sign-in leaves no browser session, and neither does an ephemeral one (iOS `prefersEphemeralWebBrowserSession`): there, the user signs in again.
        - The access token's application is a front-end or mobile application with native sign-in turned on and at least one native app registered.
        - Passkeys are enabled for the environment, or for the organization the token is for.
        - The user signed in within the last 10 minutes. Refreshing the token does not move this time forward, and neither does a browser sign-in that reuses the existing session, which carries the time the user last signed in or stepped up on that browser session, in any app on your domain. Once that is more than 10 minutes ago, send the user through the browser with `prompt=login` (or `max_age=0`) to sign them in again.

        Returns 404 when native passkey registration is unavailable in the environment.

        If the app's tokens are bound to a key with DPoP (RFC 9449; available to applications with native sign-in turned on), send the token as `Authorization: DPoP <token>` with a `DPoP` proof for this request that includes the `ath` claim. A bound token sent as a bearer token, or with a proof from another key, is refused with 401 (`TOKEN_ERROR` / `INVALID_DPOP_PROOF`).

        The `registration_session` lasts 5 minutes and can be used once. Starting another registration replaces it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The creation options for the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_options'
        '400':
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '401':
          description: |
            - `TOKEN_ERROR`: missing, invalid, expired or revoked access token, or a token sent with the wrong scheme.
            - `INVALID_DPOP_PROOF`: the token is bound to a key and the `DPoP` proof is missing, invalid, or not signed by that key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '403':
          description: |
            - `NATIVE_SIGN_IN_NOT_ALLOWED`: the token's application can't use native sign-in.
            - `PASSKEYS_NOT_ENABLED`: passkeys are off for the environment or the organization.
            - `SCOPE_MISSING`: the token wasn't granted `passkeys:register`.
            - `INVALID_AUDIENCE`: the token was issued for an API (it has an `audience`).
            - `USER_TOKEN_REQUIRED`: the token doesn't belong to a user.
            - `REAUTHENTICATION_REQUIRED`: the user last signed in more than 10 minutes ago.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '404':
          description: Native passkey registration is unavailable in the environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
        - kindeDPoPAuth: []
  /account_api/v1/passkeys/registration/verify:
    servers: []
    post:
      tags:
        - Passkeys
      operationId: VerifyPasskeyRegistration
      summary: Finish adding a passkey from a native app
      description: |
        Checks the passkey the device created and adds it to the user's account. Send the same access token as for the options call.

        The passkey must come from one of the application's registered native apps, for the domain called, with the user verified (biometrics or device PIN). An application whose native passkey requirement is `device_bound` accepts only a passkey that stays on the device.

        The `registration_session` is used up by this call whether or not it succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_session
                - credential
              properties:
                registration_session:
                  type: string
                  description: The `registration_session` from the options call.
                credential:
                  type: object
                  description: The registration response from Credential Manager or AuthenticationServices, in the WebAuthn `RegistrationResponseJSON` format.
      responses:
        '201':
          description: The passkey was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_result'
        '400':
          description: |
            - `INVALID_REQUEST`: the body is not valid JSON, or a field is missing.
            - `INVALID_SESSION`: the `registration_session` is unknown, expired, already used, or for another user or application.
            - `INVALID_CREDENTIAL`: `credential` is not a WebAuthn registration response.
            - `VERIFICATION_FAILED`: the passkey is not from one of the application's apps, is for another domain, the user was not verified, or the challenge does not match.
            - `PASSKEY_REQUIREMENT_NOT_MET`: the application accepts only passkeys that stay on the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '401':
          description: |
            - `TOKEN_ERROR`: missing, invalid, expired or revoked access token, or a token sent with the wrong scheme.
            - `INVALID_DPOP_PROOF`: the token is bound to a key and the `DPoP` proof is missing, invalid, or not signed by that key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '403':
          description: As for the options call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '404':
          description: Native passkey registration is unavailable in the environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '409':
          description: The passkey is already registered (`CREDENTIAL_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passkey_registration_error'
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
        - kindeDPoPAuth: []
  /account_api/v1/permissions:
    servers: []
    get:
      tags:
        - Permissions
      operationId: GetUserPermissions
      summary: Get permissions
      description: |
        Returns all the permissions the user has
      parameters:
        - name: page_size
          in: query
          required: false
          description: Number of results per page. Defaults to 10 if parameter not sent.
          schema:
            type: integer
            nullable: true
        - name: starting_after
          in: query
          required: false
          description: The ID of the permission to start after.
          schema:
            type: string
            nullable: true
            example: perm_1234567890abcdef
      responses:
        '200':
          description: Permissions successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_user_permissions_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /account_api/v1/portal_link:
    servers: []
    get:
      tags:
        - Self-serve portal
      operationId: GetPortalLink
      summary: Get self-serve portal link
      description: |
        Returns a link to the self-serve portal for the authenticated user. The user can use this link to manage their account, update their profile, and view their entitlements.

        The link is single use and expires 10 minutes after it is generated. Redirect the user to it rather than storing it or sending it on.
      parameters:
        - name: subnav
          in: query
          description: |
            The area of the portal you want the user to land on. When the access token carries no org_code claim, or names an organization the user is no longer a member of, the link lands on profile instead. That applies to every value here except profile: the organization areas need the organization, and so do the plan and payment areas, which resolve the billing account through it.
          schema:
            type: string
            nullable: true
            enum:
              - profile
              - organization_details
              - organization_payment_details
              - organization_plan_selection
              - payment_details
              - plan_details
              - plan_selection
        - name: return_url
          in: query
          description: The URL to redirect the user to after they have completed their actions in the portal.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Successfully generated the portal link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portal_link'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /account_api/v1/properties:
    servers: []
    get:
      tags:
        - Properties
      operationId: GetUserProperties
      summary: Get properties
      description: |
        Returns all properties for the user
      parameters:
        - name: page_size
          in: query
          required: false
          description: Number of results per page. Defaults to 10 if parameter not sent.
          schema:
            type: integer
            nullable: true
        - name: starting_after
          in: query
          required: false
          description: The ID of the property to start after.
          schema:
            type: string
            nullable: true
            example: prop_1234567890abcdef
      responses:
        '200':
          description: Properties successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_user_properties_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
  /account_api/v1/roles:
    servers: []
    get:
      tags:
        - Roles
      operationId: GetUserRoles
      summary: Get roles
      description: |
        Returns all roles for the user
      parameters:
        - name: page_size
          in: query
          required: false
          description: Number of results per page. Defaults to 10 if parameter not sent.
          schema:
            type: integer
            nullable: true
        - name: starting_after
          in: query
          required: false
          description: The ID of the role to start after.
          schema:
            type: string
            nullable: true
            example: role_1234567890abcdef
      responses:
        '200':
          description: Roles successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_user_roles_response'
        '403':
          description: Invalid credentials.
        '429':
          description: Request was throttled.
      security:
        - kindeBearerAuth: []
components:
  schemas:
    token_introspect:
      type: object
      properties:
        active:
          type: boolean
          description: Indicates the status of the token.
        aud:
          type: array
          description: Array of intended token recipients.
          items:
            type: string
            example: https://api.example.com/v1
        client_id:
          type: string
          description: Identifier for the requesting client.
          example: 3b0b5c6c8fcc464fab397f4969b5f482
        exp:
          type: integer
          description: Token expiration timestamp.
          example: 1612345678
        iat:
          type: integer
          description: Token issuance timestamp.
          example: 1612345678
    token_error_response:
      type: object
      properties:
        error:
          type: string
          description: Error.
        error_description:
          type: string
          description: The error description.
    user_profile_v2:
      type: object
      properties:
        sub:
          type: string
          description: Unique ID of the user in Kinde.
          example: kp_c3143a4b50ad43c88e541d9077681782
        provided_id:
          type: string
          description: Value of the user's ID in a third-party system when the user is imported into Kinde.
          example: some_external_id
          nullable: true
        name:
          type: string
          description: User's first and last name separated by a space.
          example: John Snow
        given_name:
          type: string
          description: User's first name.
          example: John
        family_name:
          type: string
          description: User's last name.
          example: Snow
        updated_at:
          type: integer
          description: Date the user was last updated at (In Unix time).
          example: 1612345678
        email:
          type: string
          description: User's email address if available.
          example: john.snow@example.com
        email_verified:
          type: boolean
          description: Whether the user's email address has been verified.
          example: true
        picture:
          type: string
          description: URL that point's to the user's picture or avatar
          example: https://example.com/john_snow.jpg
          nullable: true
        preferred_username:
          type: string
          description: User's preferred username.
          example: john_snow
          nullable: true
        id:
          type: string
          description: Unique ID of the user in Kinde
          example: kp_c3143a4b50ad43c88e541d9077681782
    portal_link:
      type: object
      properties:
        url:
          type: string
          description: Unique URL to redirect the user to.
          example: https://<your_kinde_subdomain>.kinde.com/portal_redirect?key=4f3c1d9e2b7a86f05c41d8e37b90a2c6f5e14d8b3a97c02e6d15f8b47a3c90e2
    get_entitlements_response:
      type: object
      properties:
        data:
          type: object
          properties:
            org_code:
              type: string
              description: The organization code the entitlements are associated with.
              example: org_0195ac80a14e
            plans:
              type: array
              description: A list of plans the user is subscribed to
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: A unique code for the plan
                    example: pro_plan
                  name:
                    type: string
                    description: Name of the plan
                    example: Pro
                  subscribed_on:
                    type: string
                    format: date-time
                    description: The date the user subscribed to the plan
                    example: '2025-06-01T12:00:00Z'
            entitlements:
              type: array
              description: A list of entitlements
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The friendly id of an entitlement
                    example: entitlement_0195ac80a14e8d71f42b98e75d3c61ad
                  fixed_charge:
                    type: integer
                    description: The price charged if this is an entitlement for a fixed charged
                    example: 35
                    nullable: true
                  price_name:
                    type: string
                    description: The name of the price associated with the entitlement
                    example: Pro gym
                  unit_amount:
                    type: integer
                    description: The price charged for this entitlement in cents
                    nullable: true
                    example: null
                  feature_key:
                    type: string
                    description: The key of the feature corresponding to this entitlement
                    example: base_price
                  feature_name:
                    type: string
                    description: The name of the feature corresponding to this entitlement
                    example: Pro Gym
                  entitlement_limit_max:
                    type: integer
                    description: The maximum number of units of the feature the customer is entitled to
                    nullable: true
                    example: null
                  entitlement_limit_min:
                    type: integer
                    description: The minimum number of units of the feature the customer is entitled to
                    nullable: true
                    example: null
        metadata:
          type: object
          properties:
            has_more:
              type: boolean
              description: Whether more records exist.
              example: false
            next_page_starting_after:
              type: string
              description: The ID of the last record on the current page.
              example: entitlement_0195ac80a14e8d71f42b98e75d3c61ad
    get_entitlement_response:
      type: object
      properties:
        data:
          type: object
          properties:
            org_code:
              type: string
              description: The organization code the entitlements are associated with.
              example: org_0195ac80a14e
            entitlement:
              type: object
              description: The entitlement data
              properties:
                id:
                  type: string
                  description: The friendly ID of an entitlement
                  example: entitlement_0195ac80a14e8d71f42b98e75d3c61ad
                fixed_charge:
                  type: integer
                  description: The price charged if this is an entitlement for a fixed charged
                  nullable: true
                  example: null
                price_name:
                  type: string
